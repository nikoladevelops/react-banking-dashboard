info:
  name: Register
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseURL}}/api/auth/register"
  body:
    type: json
    data: |-
      {
        "username": "{{username}}",
        "password": "{{password}}"
      }
  auth: inherit

runtime:
  variables:
    - name: username
      value: testing2
    - name: password
      value: testing2

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
